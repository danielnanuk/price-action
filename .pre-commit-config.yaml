repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies:
          [pandas-stubs, types-pyyaml, pydantic>=2.6, httpx>=0.27, tenacity>=8.2]
        args: [--strict]
        files: ^src/
