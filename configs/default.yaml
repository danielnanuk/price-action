universe:
  name: sp500
  members_file: configs/sp500_members.txt  # populated in Task 4
date_range:
  start: "2021-04-26"  # 5y daily — Massive Starter cap is ~5y for daily aggregates
  end: "2026-04-26"
data:
  cache_dir: data
  api_base_url: "https://api.massive.com"
  api_key_env: POLYGON_API_KEY
  rate_limit_per_min: 100
  timespan: day
  timespan_multiplier: 1
detectors:
  # Double T/B disabled in v1 detector tuning: 196k STANDARD candidates on
  # hourly with 6.4% win rate and PF 0.83 — detector is structurally
  # over-firing and shows no edge at any tier or TF. Re-enable once
  # rewritten with stronger context filters (see follow-ups).
  enabled: [h2, l2, flag, failed_breakout]
  param_tiers: [strict, standard, loose]
backtest:
  time_stop_bars: 20
  same_bar_priority: stop_first
report:
  output_dir: reports
  samples_per_setup: 50  # cap on annotated chart rendering
