universe:
  name: sp500
  members_file: configs/sp500_members.txt  # populated in Task 4
date_range:
  start: "2021-04-26"  # 5y daily — Massive Starter cap is ~5y for daily aggregates
  end: "2026-04-26"
data:
  cache_dir: data
  api_base_url: "https://api.massive.com"
  api_key_env: POLYGON_API_KEY
  rate_limit_per_min: 100
  timespan: day
  timespan_multiplier: 1
detectors:
  # double_top_bottom disabled (v2 detector ships in code but PF ~= 1.00 on
  # current 5y daily — no edge yet, awaits longer history with multiple
  # bear cycles). Wedge enabled — long-only (bottom wedge in bear regime)
  # was OOS-validated at PF 1.04-1.13 across all tiers.
  enabled: [h2, l2, flag, failed_breakout, wedge, climactic, outside_bar]
  param_tiers: [strict, standard, loose]
backtest:
  time_stop_bars: 20
  same_bar_priority: stop_first
report:
  output_dir: reports
  samples_per_setup: 50  # cap on annotated chart rendering
